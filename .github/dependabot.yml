# Weekly pull requests for the GitHub Actions this repository uses (they move to new Node runtimes on their own schedule) and for
# npm packages. Grouped, so a week brings at most one of each. @pkmn/sim and @pkmn/mods are left out on purpose: a new engine
# changes battles and needs the steps in docs/RUNBOOK.md, "엔진 올리기".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "@pkmn/*"
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
