name: Refresh Champions data

# Rebuilds src/data/champions-data.json from Showdown and PokeAPI once a week
# and opens a pull request only when the data changed. A failed download or a
# failed validation fails the run; nothing is merged without review.
on:
  schedule:
    - cron: "0 0 * * 1" # Monday 09:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refresh-champions-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BRANCH: data/champions-refresh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run data:champions
      - run: npm run data:battle-info
      - run: npm run data:fill-samples

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/data/champions-data.json src/data/records-pokemon.json src/data/battle-info-ko.json src/data/random-sets.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Champions data is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The identity audit checks every regulation Pokémon against the new data.
      - if: steps.diff.outputs.changed == 'true'
        run: npm test

      - if: steps.diff.outputs.changed == 'true'
        name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "chore(data): refresh Champions data, Korean battle info, and missing samples" -- src/data/champions-data.json src/data/records-pokemon.json src/data/battle-info-ko.json src/data/random-sets.json
          git push --force origin "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(data): refresh Champions data" \
              --body "The weekly refresh updated Showdown/PokeAPI data, Korean battle info, and any missing fallback sample sets, and npm test passed. Merging deploys the site and battle function."
          fi
      - if: always()
        uses: ./.github/actions/alert
        with:
          status: ${{ job.status }}
          discord_webhook: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
